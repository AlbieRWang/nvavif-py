[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nvavif_py"
readme = "README.md"
description = "High-performance Python library for encoding/decoding AVIF images using NVIDIA hardware acceleration (NVENC)."
dynamic = ["version"]
dependencies = [
    "pillow",
    "numpy"
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
[tool.maturin]
module-name = "nvavif_py._nvavif_py"
